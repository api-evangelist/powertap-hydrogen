aid: powertap-hydrogen
name: PowerTap Hydrogen
description: 'PowerTap Hydrogen Fueling Corp. is an Aliso Viejo, California hydrogen fueling technology
  company founded in 2020 and operated as a wholly owned subsidiary of the publicly traded PowerTap Hydrogen
  Capital Corp. (NEO: MOVE, OTC: MOTNF, FWB: 2K6B). PowerTap designs and deploys distributed, on-site
  "blue hydrogen" production and dispensing stations built on a patented small-scale steam methane reforming
  (SMR) platform with embedded carbon capture, converting natural gas and municipal water into high-purity
  hydrogen at the point of use rather than trucking it in. The modular station design is marketed as deployable
  in weeks instead of months, and the company positions it for heavy-duty trucking and light-vehicle refueling
  as well as baseload power for data centers. PowerTap technology-based stations operate at private enterprise
  sites and at a public station near LAX, with additional deployments cited in California, Texas, Massachusetts
  and Maryland. The company publishes no developer program, no API, and no machine-readable contract of
  any kind; it is profiled here as an energy-infrastructure company, not an API provider.'
